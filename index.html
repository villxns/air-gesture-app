<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Gesture V2</title>
  
  <!-- Import Google's MediaPipe AI Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  
  <style>
    body { 
      font-family: sans-serif; text-align: center; margin: 0; padding: 20px; 
      background-color: #121212; color: white; 
      transition: background-color 0.1s; /* Makes the color change smooth */
    }
    canvas { max-width: 100%; border: 3px solid #00ffcc; border-radius: 10px; margin-top: 20px; }
    #status { font-size: 1.2rem; font-weight: bold; color: #00ffcc; }
  </style>
</head>
<body>

  <h1>Air Gesture Engine</h1>
  <p id="status">Requesting camera permissions...</p>
  
  <!-- Hidden video element to capture the raw camera feed -->
  <video id="videoElement" style="display:none;" autoplay playsinline></video>
  
  <!-- Canvas to display the video and draw the AI hand tracking points -->
  <canvas id="canvasElement" width="640" height="480"></canvas>

  <script>
    const videoElement = document.getElementById('videoElement');
    const canvasElement = document.getElementById('canvasElement');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');

    // 1. Initialize the MediaPipe Hands AI Model
    const hands = new Hands({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    // Optimize settings for mobile phones
    hands.setOptions({
      maxNumHands: 2, // <-- Now actively tracking up to 2 hands
      modelComplexity: 0, 
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    // 2. Define what happens when the AI analyzes a frame
    hands.onResults((results) => {
      // Clear the previous frame
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      // Draw the live video feed onto the canvas
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // If hands are found on screen
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        
        // A. Loop through EVERY hand detected and draw the dots
        for (let handIndex = 0; handIndex < results.multiHandLandmarks.length; handIndex++) {
          const landmarks = results.multiHandLandmarks[handIndex];
          
          for (let i = 0; i < landmarks.length; i++) {
            const x = landmarks[i].x * canvasElement.width;
            const y = landmarks[i].y * canvasElement.height;
            
            canvasCtx.beginPath();
            canvasCtx.arc(x, y, 5, 0, 2 * Math.PI);
            canvasCtx.fillStyle = "red";
            canvasCtx.fill();
          }
        }

        // B. Air Touch Math (Using the primary hand to control the background)
        const primaryHand = results.multiHandLandmarks[0];
        const thumbTip = primaryHand[4];
        const indexTip = primaryHand[8];
        
        // Calculate distance between thumb and index finger
        const distance = Math.sqrt(
          Math.pow(thumbTip.x - indexTip.x, 2) + 
          Math.pow(thumbTip.y - indexTip.y, 2)
        );

        // If distance is very small (fingers touching), trigger the Air Touch
        if (distance < 0.05) {
          statusText.innerText = "🤏 AIR TOUCH ACTIVATED!";
          document.body.style.backgroundColor = "#ff0044"; // Flash background red
        } else {
          statusText.innerText = "Hands Detected! 🖐️ (Pinch to touch)";
          document.body.style.backgroundColor = "#121212"; // Revert background to dark
        }
        
      } else {
        // No hands on screen
        statusText.innerText = "Waiting for hands...";
        document.body.style.backgroundColor = "#121212"; 
      }
    });

    // 3. Connect the webcam to the AI model
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({image: videoElement});
      },
      width: 640,
      height: 480
    });
    
    // Start the engine
    camera.start().then(() => {
      statusText.innerText = "Camera Active. Show your hands!";
    }).catch((err) => {
      statusText.innerText = "Error accessing camera. Check permissions.";
      console.error(err);
    });
  </script>
</body>
</html>
